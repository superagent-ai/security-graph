steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg
      - VERSION=${_VERSION}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, '${_IMAGE}', version]
images: ['${_IMAGE}']
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _VERSION: dev
  _IMAGE: europe-west1-docker.pkg.dev/superagent-410019/security-graph/service:cloud-build
